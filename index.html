<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Emmanuel T. | Software Developer</title>
    <meta name="title" content="Emmanuel T. | Software Developer" />
    <meta
      name="description"
      content="Full-stack web developer specializing in building modern, responsive websites using the React ecosystem, TypeScript, and Tailwind CSS. Helping small businesses and creatives establish their online presence."
    />
    <meta
      name="keywords"
      content="Software Developer, Full-stack Developer, React, TypeScript, Tailwind CSS, Web Development, Portfolio, Audio Engineering, Italy, NYC"
    />
    <meta name="author" content="Emmanuel T." />
    <link rel="canonical" href="https://emmanueltejeda.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://emmanueltejeda.com/" />
    <meta property="og:title" content="Emmanuel T. || Software Developer" />
    <meta
      property="og:description"
      content="Full-stack web developer specializing in building modern, responsive websites using the React ecosystem, TypeScript, and Tailwind CSS."
    />
    <meta
      property="og:image"
      content="https://emmanueltejeda.com/og-image.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://emmanueltejeda.com/" />
    <meta property="twitter:title" content="Emmanuel T. | Software Developer" />
    <meta
      property="twitter:description"
      content="Full-stack web developer specializing in building modern, responsive websites using the React ecosystem, TypeScript, and Tailwind CSS."
    />
    <meta
      property="twitter:image"
      content="https://emmanueltejeda.com/og-image.png"
    />

    <!-- Theme Color for Browser Mobile Bars -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Emmanuel T.",
        "url": "https://emmanueltejeda.com/",
        "jobTitle": "Full-stack Software Developer",
        "knowsAbout": [
          "React",
          "TypeScript",
          "Node.js",
          "Web Development",
          "Audio Engineering"
        ],
        "sameAs": [
          "https://github.com/emmtej",
          "https://linkedin.com/in/emmanueltejeda"
        ]
      }
    </script>

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        if (
          saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify detection -->
    <form
      name="contact"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
