[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Production HTTP redirects. Astro keeps portable static fallbacks for these
# paths, so force is required to override their generated HTML on Netlify.
[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/it/about"
  to = "/it/"
  status = 301
  force = true

# Netlify shadowing preserves existing Italian routes and serves this only for
# missing /it/* paths. HTTP status still requires deploy-preview verification.
[[redirects]]
  from = "/it/*"
  to = "/it/404/"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Full hash-based CSP is generated into dist/_headers after Astro builds.

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
